name: Build OrangeFox for Xiaomi 10S (thyme)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'OrangeFox manifest branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
          - '11.0'
      build_target:
        description: 'Build target partition'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot
          - vendorboot

env:
  MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch || '12.1' }}
  BUILD_TARGET: ${{ github.event.inputs.build_target || 'recovery' }}
  DEVICE_NAME: thyme
  DEVICE_PATH: device/xiaomi/thyme
  TWRP_TREE_URL: https://github.com/Samuioto/twrp_device_thyme.git

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clean up disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Display build configuration
        run: |
          echo "::group::Build Configuration"
          echo "Manifest branch: ${MANIFEST_BRANCH}"
          echo "Build target: ${BUILD_TARGET}"
          echo "Device: ${DEVICE_NAME}"
          echo "Device path: ${DEVICE_PATH}"
          echo "::endgroup::"

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y upgrade
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox sources
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch ${MANIFEST_BRANCH} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}

      - name: Free up disk space after sync
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          echo "::group::Disk space before cleanup"
          df -h ${GITHUB_WORKSPACE}
          echo "::endgroup::"
          
          # Delete .repo (saves ~10GB, not needed after sync)
          rm -rf .repo
          
          # Remove sync scripts
          rm -rf ${GITHUB_WORKSPACE}/OrangeFox/sync
          
          # Remove test suites only (safe to delete, not needed for building)
          rm -rf cts 2>/dev/null || true
          rm -rf compatibility 2>/dev/null || true
          
          # Clean apt cache
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/*
          
          echo "::group::Disk space after cleanup"
          df -h ${GITHUB_WORKSPACE}
          echo "::endgroup::"

      - name: Clone TWRP device tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          git clone ${TWRP_TREE_URL} -b master ./${DEVICE_PATH}
          cd ${DEVICE_PATH}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "Device tree cloned successfully"

      - name: Apply OrangeFox overlay
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          
          # Copy our OrangeFox-adapted files over the TWRP tree
          cp -rf ${GITHUB_WORKSPACE}/overlay/* ./${DEVICE_PATH}/
          
          # Remove the TWRP product makefile (replaced by twrp_thyme.mk)
          rm -f ./${DEVICE_PATH}/omni_thyme.mk
          
          echo "::group::Verify overlay files"
          echo "=== AndroidProducts.mk ==="
          cat ./${DEVICE_PATH}/AndroidProducts.mk
          echo ""
          echo "=== twrp_thyme.mk ==="
          cat ./${DEVICE_PATH}/twrp_thyme.mk
          echo ""
          echo "=== vendorsetup.sh ==="
          cat ./${DEVICE_PATH}/vendorsetup.sh
          echo ""
          echo "=== recovery.fstab ==="
          cat ./${DEVICE_PATH}/recovery.fstab
          echo "::endgroup::"

      - name: Build OrangeFox
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          
          export FOX_BUILD_DEVICE=${DEVICE_NAME}
          export ALLOW_MISSING_DEPENDENCIES=true
          
          set +e
          source build/envsetup.sh
          set -e
          
          if [ "${MANIFEST_BRANCH}" = "11.0" ] || [ "${MANIFEST_BRANCH}" = "12.1" ]; then
            lunch twrp_${DEVICE_NAME}-eng && make clean && mka adbd ${BUILD_TARGET}image
          else
            lunch omni_${DEVICE_NAME}-eng && make clean && mka adbd ${BUILD_TARGET}image
          fi
          
          echo "::group::Disk space after build"
          df -h ${GITHUB_WORKSPACE}
          echo "::endgroup::"

      - name: Rebuild recovery image if missing
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          
          # Check if OrangeFox img exists anywhere
          if ! find out/ -name "OrangeFox*.img" 2>/dev/null | grep -q .; then
            echo "OrangeFox .img not found, checking for raw recovery.img in intermediates..."
            
            # Search for any recovery.img in obj/PACKAGING
            RAW_IMG=$(find out/ -path "*/obj/PACKAGING/*" -name "recovery.img" 2>/dev/null | head -1)
            
            if [ -n "$RAW_IMG" ]; then
              echo "Found raw recovery.img: $RAW_IMG"
              # Copy it to the expected output location
              OUT_BASE="out/target/product/${DEVICE_NAME}/target/product/${DEVICE_NAME}"
              mkdir -p "$OUT_BASE"
              cp "$RAW_IMG" "$OUT_BASE/OrangeFox-unofficial-${DEVICE_NAME}.img"
              echo "Copied raw recovery.img to output directory"
            else
              echo "No raw recovery.img found either. Attempting to rebuild just the image..."
              
              # Free up space by removing intermediate object files
              echo "::group::Cleaning intermediates to free space"
              find out/target/product/${DEVICE_NAME}/obj -name "*.o" -delete 2>/dev/null || true
              find out/target/product/${DEVICE_NAME}/obj -name "*.a" -delete 2>/dev/null || true
              df -h ${GITHUB_WORKSPACE}
              echo "::endgroup::"
              
              set +e
              source build/envsetup.sh
              set -e
              lunch twrp_${DEVICE_NAME}-eng
              mka ${BUILD_TARGET}image
              
              # Check again
              if ! find out/ -name "OrangeFox*.img" 2>/dev/null | grep -q .; then
                RAW_IMG=$(find out/ -path "*/obj/PACKAGING/*" -name "recovery.img" 2>/dev/null | head -1)
                if [ -n "$RAW_IMG" ]; then
                  OUT_BASE="out/target/product/${DEVICE_NAME}/target/product/${DEVICE_NAME}"
                  mkdir -p "$OUT_BASE"
                  cp "$RAW_IMG" "$OUT_BASE/OrangeFox-unofficial-${DEVICE_NAME}.img"
                else
                  echo "Still no image found after rebuild"
                  exit 1
                fi
              fi
            fi
          fi

      - name: Set build date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Check if recovery image exists
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          
          echo "::group::Disk space"
          df -h ${GITHUB_WORKSPACE}
          echo "::endgroup::"
          
          echo "::group::Search for recovery images"
          # Search entire out/ for any .img or OrangeFox files
          find out/ -name "OrangeFox*.img" -o -name "recovery.img" -o -name "boot.img" 2>/dev/null || true
          echo "---"
          # Also list the target/product directory (handles doubled path)
          find out/target/product/${DEVICE_NAME}/ -name "OrangeFox*" 2>/dev/null || true
          echo "::endgroup::"
          
          # Try multiple possible locations for the image
          IMG_FOUND=""
          for path in \
            "out/target/product/${DEVICE_NAME}/OrangeFox*.img" \
            "out/target/product/${DEVICE_NAME}/target/product/${DEVICE_NAME}/OrangeFox*.img" \
            "out/target/product/${DEVICE_NAME}/recovery.img" \
            "out/target/product/${DEVICE_NAME}/target/product/${DEVICE_NAME}/recovery.img" \
            "out/target/product/${DEVICE_NAME}/obj/PACKAGING/recoveryimage_intermediates/recovery.img" \
            "out/target/product/${DEVICE_NAME}/target/product/${DEVICE_NAME}/obj/PACKAGING/recoveryimage_intermediates/recovery.img"; do
            if ls $path 1> /dev/null 2>&1; then
              IMG_FOUND=$(ls $path 2>/dev/null | head -1)
              break
            fi
          done
          
          if [ -n "$IMG_FOUND" ]; then
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=$(dirname $IMG_FOUND)" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum "$IMG_FOUND" | cut -d ' ' -f 1)" >> $GITHUB_ENV
            echo "Found image: $IMG_FOUND"
            # Normalize to OrangeFox naming
            cd "$(dirname $IMG_FOUND)"
            if [ ! -f "OrangeFox-unofficial-${DEVICE_NAME}.img" ]; then
              cp "$(basename $IMG_FOUND)" "OrangeFox-unofficial-${DEVICE_NAME}.img"
            fi
          else
            echo "No .img file found, trying to extract from zip..."
            ZIP_FILE=$(find out/ -name "OrangeFox*.zip" 2>/dev/null | head -1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found zip: $ZIP_FILE"
              EXTRACT_DIR=$(dirname "$ZIP_FILE")
              cd "$EXTRACT_DIR"
              unzip -o "OrangeFox*.zip" -d extracted 2>/dev/null || true
              IMG_IN_ZIP=$(find extracted/ -name "*.img" 2>/dev/null | head -1)
              if [ -n "$IMG_IN_ZIP" ]; then
                cp "$IMG_IN_ZIP" "OrangeFox-unofficial-${DEVICE_NAME}.img"
                echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
                echo "FILE_PATH=$EXTRACT_DIR" >> $GITHUB_ENV
                echo "MD5_IMG=$(md5sum "OrangeFox-unofficial-${DEVICE_NAME}.img" | cut -d ' ' -f 1)" >> $GITHUB_ENV
                echo "Extracted image from zip"
              else
                echo "No .img found inside zip either"
                ls -lah extracted/ 2>/dev/null || true
                exit 1
              fi
            else
              echo "No OrangeFox zip found either"
              exit 1
            fi
          fi

      - name: Rename recovery image
        run: |
          cd ${{ env.FILE_PATH }}/
          if [ "${BUILD_TARGET}" = "boot" ]; then
            mv OrangeFox*.img boot.img
            echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
          elif [ "${BUILD_TARGET}" = "vendorboot" ]; then
            mv OrangeFox*.img vendor_boot.img
            echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
          else
            mv OrangeFox*.img recovery.img
            echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
          fi

      - name: Upload recovery image artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          path: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/OrangeFox*.zip
          retention-days: 30

      - name: Create release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/OrangeFox*.zip
          name: OrangeFox for Xiaomi 10S (thyme) // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            ## OrangeFox Recovery for Xiaomi 10S (thyme)

            | Item | Value |
            |------|-------|
            | **Build** | fox_${{ env.MANIFEST_BRANCH }} |
            | **Date** | ${{ env.BUILD_DATE }} |
            | **Target** | ${{ env.RECOVERY_TYPE }}.img |
            | **MD5** | ${{ env.MD5_IMG }} |

            ### Device tree
            Based on [Samuioto/twrp_device_thyme](https://github.com/Samuioto/twrp_device_thyme) adapted for OrangeFox.

            ### Install
            thyme is an A/B device with NO separate recovery partition.
            The recovery image is flashed to the **boot** partition.

            ```bash
            # Boot to fastboot mode
            adb reboot bootloader
            fastboot devices

            # Flash to both slots
            fastboot flash boot_a ${{ env.RECOVERY_TYPE }}.img
            fastboot flash boot_b ${{ env.RECOVERY_TYPE }}.img

            # Boot to recovery
            fastboot boot ${{ env.RECOVERY_TYPE }}.img
            ```
