name: Build OrangeFox for Xiaomi 10S (thyme)

on:
  workflow_dispatch:
    inputs:
      manifest_branch:
        description: 'OrangeFox manifest branch'
        required: true
        default: '12.1'
        type: choice
        options:
          - '12.1'
          - '11.0'
      build_target:
        description: 'Build target partition'
        required: true
        default: 'recovery'
        type: choice
        options:
          - recovery
          - boot
          - vendorboot

env:
  MANIFEST_BRANCH: ${{ github.event.inputs.manifest_branch || '12.1' }}
  BUILD_TARGET: ${{ github.event.inputs.build_target || 'recovery' }}
  DEVICE_NAME: thyme
  DEVICE_PATH: device/xiaomi/thyme
  TWRP_TREE_URL: https://github.com/Samuioto/twrp_device_thyme.git

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Set up swap space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Display build configuration
        run: |
          echo "::group::Build Configuration"
          echo "Manifest branch: ${MANIFEST_BRANCH}"
          echo "Build target: ${BUILD_TARGET}"
          echo "Device: ${DEVICE_NAME}"
          echo "Device path: ${DEVICE_PATH}"
          echo "::endgroup::"

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y upgrade
          git clone https://gitlab.com/OrangeFox/misc/scripts
          cd scripts
          sudo bash setup/android_build_env.sh

      - name: Sync OrangeFox sources
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
          cd ${GITHUB_WORKSPACE}/OrangeFox
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch ${MANIFEST_BRANCH} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}

      - name: Free up disk space after sync
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          echo "::group::Disk space before cleanup"
          df -h ${GITHUB_WORKSPACE}
          echo "::endgroup::"
          
          # Delete .repo (saves ~10GB, not needed after sync)
          rm -rf .repo
          
          # Remove sync scripts
          rm -rf ${GITHUB_WORKSPACE}/OrangeFox/sync
          
          # Remove test suites only (safe to delete, not needed for building)
          rm -rf cts 2>/dev/null || true
          rm -rf compatibility 2>/dev/null || true
          
          # Clean apt cache
          sudo apt-get clean
          sudo rm -rf /var/cache/apt/*
          
          echo "::group::Disk space after cleanup"
          df -h ${GITHUB_WORKSPACE}
          echo "::endgroup::"

      - name: Clone TWRP device tree
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          git clone ${TWRP_TREE_URL} -b master ./${DEVICE_PATH}
          cd ${DEVICE_PATH}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "Device tree cloned successfully"

      - name: Apply OrangeFox overlay
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          
          # Copy our OrangeFox-adapted files over the TWRP tree
          cp -rf ${GITHUB_WORKSPACE}/overlay/* ./${DEVICE_PATH}/
          
          # Remove the TWRP product makefile (replaced by twrp_thyme.mk)
          rm -f ./${DEVICE_PATH}/omni_thyme.mk
          
          echo "::group::Verify overlay files"
          echo "=== AndroidProducts.mk ==="
          cat ./${DEVICE_PATH}/AndroidProducts.mk
          echo ""
          echo "=== twrp_thyme.mk ==="
          cat ./${DEVICE_PATH}/twrp_thyme.mk
          echo ""
          echo "=== vendorsetup.sh ==="
          cat ./${DEVICE_PATH}/vendorsetup.sh
          echo ""
          echo "=== recovery.fstab ==="
          cat ./${DEVICE_PATH}/recovery.fstab
          echo "::endgroup::"

      - name: Build OrangeFox
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          
          export FOX_BUILD_DEVICE=${DEVICE_NAME}
          export ALLOW_MISSING_DEPENDENCIES=true
          
          set +e
          source build/envsetup.sh
          set -e
          
          if [ "${MANIFEST_BRANCH}" = "11.0" ] || [ "${MANIFEST_BRANCH}" = "12.1" ]; then
            lunch twrp_${DEVICE_NAME}-eng
          else
            lunch omni_${DEVICE_NAME}-eng
          fi

          # The recoveryimage packaging rule (ramdisk_files-timestamp) rsyncs the
          # generic boot ramdisk dir "$(TARGET_ROOT_OUT)/root" as the base for the
          # recovery ramdisk. In this TWRP-only port nothing populates root/ (all
          # content lives under recovery/root), so the dir is never created and
          # ninja fails with: rsync: link_stat ".../root" failed: No such file.
          # The dir only needs to EXIST and be empty - the rsync then no-ops and
          # the Fox overlay steps (OrangeFox_A12.sh etc.) build the ramdisk.
          mkdir -p "${ANDROID_PRODUCT_OUT}/root"
          echo "Created empty TARGET_ROOT_OUT: ${ANDROID_PRODUCT_OUT}/root"

          mka adbd ${BUILD_TARGET}image
          
          echo "::group::Disk space after build"
          df -h ${GITHUB_WORKSPACE}
          echo "::endgroup::"

      - name: Set build date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Find and package recovery image
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${MANIFEST_BRANCH}
          
          echo "::group::Search for all .img files"
          find out/ \( -name "*.img" -o -name "OrangeFox*" \) 2>/dev/null || true
          echo "::endgroup::"
          
          # Search for the recovery image in all possible locations
          IMG_FOUND=""
          for pattern in \
            "out/target/product/${DEVICE_NAME}/target/product/${DEVICE_NAME}/OrangeFox*.img" \
            "out/target/product/${DEVICE_NAME}/OrangeFox*.img" \
            "out/target/product/${DEVICE_NAME}/target/product/${DEVICE_NAME}/recovery.img" \
            "out/target/product/${DEVICE_NAME}/recovery.img" \
            "out/target/product/${DEVICE_NAME}/target/product/${DEVICE_NAME}/boot.img" \
            "out/target/product/${DEVICE_NAME}/boot.img" \
            "out/target/product/${DEVICE_NAME}/target/product/${DEVICE_NAME}/obj/PACKAGING/recoveryimage_intermediates/recovery.img"; do
            MATCH=$(ls $pattern 2>/dev/null | head -1)
            if [ -n "$MATCH" ]; then
              IMG_FOUND="$MATCH"
              break
            fi
          done
          
          if [ -n "$IMG_FOUND" ]; then
            echo "Found image: $IMG_FOUND"
            # Fox names its output e.g. OrangeFox-R12.0-Unofficial-thyme.img.
            # Keep the found file's absolute path - do NOT copy another copy,
            # otherwise the later `mv OrangeFox*.img` glob matches two files.
            IMG_PATH=$(realpath "$IMG_FOUND")
            FILE_DIR=$(dirname "$IMG_PATH")
            # Fox also produces an installer zip (if it exists); keep its abs path for later steps
            ZIP_FILE=$(find . -name "OrangeFox*.zip" 2>/dev/null | head -1)
            if [ -n "$ZIP_FILE" ]; then
              ZIP_FILE=$(realpath "$ZIP_FILE")
            fi
            echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
            echo "FILE_PATH=$FILE_DIR" >> $GITHUB_ENV
            echo "IMG_PATH=$IMG_PATH" >> $GITHUB_ENV
            echo "ZIP_PATH=${ZIP_FILE:-}" >> $GITHUB_ENV
            echo "MD5_IMG=$(md5sum "$IMG_FOUND" | cut -d ' ' -f 1)" >> $GITHUB_ENV
          else
            echo "No .img found anywhere. Build may have failed to produce recovery image."
            echo "Checking for zip installer..."
            ZIP_FILE=$(find out/ -name "OrangeFox*.zip" 2>/dev/null | head -1)
            if [ -n "$ZIP_FILE" ]; then
              echo "Found zip: $ZIP_FILE - but no .img was produced."
              echo "The recovery image was not built. Check BoardConfig.mk for BOARD_RECOVERYIMAGE_PARTITION_SIZE."
            fi
            exit 1
          fi

      - name: Rename recovery image
        run: |
          cd "${{ env.FILE_PATH }}"
          IMG_NAME=$(basename "${{ env.IMG_PATH }}")

          # Map the requested build target to the final artifact filename.
          if [ "${BUILD_TARGET}" = "boot" ]; then
            RECOVERY_TYPE="boot"
          elif [ "${BUILD_TARGET}" = "vendorboot" ]; then
            RECOVERY_TYPE="vendor_boot"
          else
            RECOVERY_TYPE="recovery"
          fi

          # Rename the single found image (skip if it already has the right name).
          if [ "${IMG_NAME}" != "${RECOVERY_TYPE}.img" ]; then
            mv "${IMG_NAME}" "${RECOVERY_TYPE}.img"
          fi
          echo "RECOVERY_TYPE=${RECOVERY_TYPE}" >> $GITHUB_ENV

          RELEASE_FILES="${{ env.FILE_PATH }}/${RECOVERY_TYPE}.img"
          if [ -n "${{ env.ZIP_PATH }}" ]; then
            RELEASE_FILES="${RELEASE_FILES}"$'\n'"${{ env.ZIP_PATH }}"
          fi
          printf 'RELEASE_FILES<<EOF\n%s\nEOF\n' "${RELEASE_FILES}" >> $GITHUB_ENV

      - name: Upload recovery image artifact
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ env.DEVICE_NAME }}-${{ env.BUILD_DATE }}
          if-no-files-found: warn
          path: |
            ${{ env.FILE_PATH }}/${{ env.RECOVERY_TYPE }}.img
            ${{ env.FILE_PATH }}/OrangeFox*.zip
          retention-days: 30

      - name: Create release
        if: env.CHECK_IMG_IS_OK == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.RELEASE_FILES }}
          name: OrangeFox for Xiaomi 10S (thyme) // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            ## OrangeFox Recovery for Xiaomi 10S (thyme)

            | Item | Value |
            |------|-------|
            | **Build** | fox_${{ env.MANIFEST_BRANCH }} |
            | **Date** | ${{ env.BUILD_DATE }} |
            | **Target** | ${{ env.RECOVERY_TYPE }}.img |
            | **MD5** | ${{ env.MD5_IMG }} |

            ### Device tree
            Based on [Samuioto/twrp_device_thyme](https://github.com/Samuioto/twrp_device_thyme) adapted for OrangeFox.

            ### Install
            thyme is an A/B device with NO separate recovery partition.
            The recovery image is flashed to the **boot** partition.

            ```bash
            # Boot to fastboot mode
            adb reboot bootloader
            fastboot devices

            # Flash to both slots
            fastboot flash boot_a ${{ env.RECOVERY_TYPE }}.img
            fastboot flash boot_b ${{ env.RECOVERY_TYPE }}.img

            # Boot to recovery
            fastboot boot ${{ env.RECOVERY_TYPE }}.img
            ```
